name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build
        shell: cmd
        run: build.cmd
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ".\GainwardLedOff.exe" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes "Download and run GainwardLedOff.exe." --verify-tag
